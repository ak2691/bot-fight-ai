# LLaMA-Factory starting configuration for the first Bot Fight SFT run.
# Run from training/ after data/generated/train.jsonl exists.

model_name_or_path: Qwen/Qwen3-4B-Thinking-2507
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
quantization_bit: 4
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

dataset_dir: data
dataset: botfight_sft
eval_dataset: botfight_sft_validation
template: qwen3_nothink
cutoff_len: 2048
preprocessing_num_workers: 1
dataloader_num_workers: 0

output_dir: runs/BotFightAI-v0.1
logging_steps: 1
save_steps: 100
save_total_limit: 2
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01

bf16: true
fp16: false
eval_strategy: steps
eval_steps: 100
val_size: 0.0
